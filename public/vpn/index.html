<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Личный VPN</title><link rel="stylesheet" href="/vpn/vpn.css"></head><body><main class="shell"><header><div><p class="eyebrow">Oleslav / Private</p><h1>Настройка VPN</h1><p class="sub">Учёт устройств: сейчас создаются только черновики. VPN-ключи не выдаются и сервер не изменяется.</p></div><button class="secondary" id="logout">Выйти</button></header><div class="notice" id="connection">Проверяем хранилище…</div><section class="panel"><h2>Добавить устройство</h2><form id="create"><label for="device">Название устройства</label><input id="device" maxlength="64" placeholder="Например, телефон" required><label for="protocol">Протокол</label><select id="protocol"><option value="xray">Xray VLESS Reality</option><option value="awg">AmneziaWG 3.1</option></select><button type="submit" disabled>Создать черновик устройства</button></form><p class="hint">Регистрация устройства ещё не создаёт реальное VPN-подключение.</p></section><section class="panel"><h2>Устройства</h2><div id="devices">Загрузка…</div></section></main><script src="/vpn/app.js" defer></script></body></html>
